name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Xcode 27 image (public preview) matches the local toolchain; macos-26 only has Xcode 26.
    runs-on: xcode-27
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
    steps:
      - uses: actions/checkout@v7
      - run: sudo xcode-select -s /Applications/Xcode_27.1.app
      - run: brew install xcodegen
      - uses: actions/cache@v6
        with:
          path: build/SourcePackages
          key: spm-${{ hashFiles('project.yml') }}
      - run: xcodegen generate
      - name: Test
        run: xcodebuild -scheme Shoji -derivedDataPath build -destination 'platform=macOS' -skipPackagePluginValidation -resultBundlePath build/TestResults.xcresult test
      - name: Test report
        if: ${{ !cancelled() && hashFiles('build/TestResults.xcresult/Info.plist') != '' }}
        env:
          # On pull requests github.sha is GitHub's temporary merge commit, not one of the PR's commits.
          REPORT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          scripts/test-report.py build/TestResults.xcresult > build/test-report.md
          cat build/test-report.md >> "$GITHUB_STEP_SUMMARY"
      # One comment per PR, updated on every push. Fork PRs get a read-only token, so they only get the run summary.
      - name: Comment on the pull request
        if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && hashFiles('build/test-report.md') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          COMMENTS: repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments
        run: |
          id=$(gh api "$COMMENTS" --paginate --jq '.[] | select(.body | startswith("<!-- shoji-test-report -->")) | .id' | head -n 1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/$id" -F body=@build/test-report.md > /dev/null
          else
            gh api -X POST "$COMMENTS" -F body=@build/test-report.md > /dev/null
          fi
