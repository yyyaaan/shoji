name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Xcode 27 image (public preview) matches the local toolchain; macos-26 only has Xcode 26.
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
    steps:
      - uses: actions/checkout@v7
      - run: sudo xcode-select -s /Applications/Xcode_27.1.app
      - run: brew install xcodegen
      - uses: actions/cache@v6
        with:
          path: build/SourcePackages
          key: spm-${{ hashFiles('project.yml') }}
      - run: xcodegen generate
      - name: Test
        run: xcodebuild -scheme Shoji -derivedDataPath build -destination 'platform=macOS' -skipPackagePluginValidation test
