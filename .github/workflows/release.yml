name: Release

# Merging a version bump releases it: when MARKETING_VERSION in project.yml names a version with no
# release yet, this builds the DMG and publishes vX.Y.Z, creating the tag on that commit. It tags and
# releases in one workflow because a tag pushed with GITHUB_TOKEN wouldn't trigger another workflow.
on:
  push:
    branches: [main]
    paths: [project.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      released: ${{ steps.version.outputs.released }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^ *MARKETING_VERSION: *"\(.*\)"/\1/p' project.yml)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "v$version is already released; nothing to do."
          fi

  dmg:
    needs: check
    if: needs.check.outputs.released != 'true'
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - run: sudo xcode-select -s /Applications/Xcode_27.1.app
      - run: brew install xcodegen
      - name: Build DMG
        run: echo "DMG=$(BUILD_NUMBER=${{ github.run_number }} scripts/package.sh "$VERSION" | tail -1)" >> "$GITHUB_ENV"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" "$DMG" --target "$GITHUB_SHA" --title "Shoji $VERSION" --generate-notes \
            --notes "Ad-hoc signed, not notarized. On first launch macOS blocks it: open System Settings › Privacy & Security › Open Anyway, or run \`xattr -dr com.apple.quarantine /Applications/Shoji.app\`."
