name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  dmg:
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
    steps:
      - uses: actions/checkout@v7
      - run: sudo xcode-select -s /Applications/Xcode_27.1.app
      - run: brew install xcodegen
      - name: Build DMG
        run: echo "DMG=$(BUILD_NUMBER=${{ github.run_number }} scripts/package.sh "${GITHUB_REF_NAME#v}" | tail -1)" >> "$GITHUB_ENV"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$DMG" --generate-notes --notes "Ad-hoc signed, not notarized. On first launch macOS blocks it: open System Settings › Privacy & Security › Open Anyway, or run \`xattr -dr com.apple.quarantine /Applications/Shoji.app\`."
