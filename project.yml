name: Shoji

options:
  bundleIdPrefix: fi.yan
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    DEAD_CODE_STRIPPING: YES
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual

packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    exactVersion: 1.99.1

targets:
  Shoji:
    type: application
    platform: macOS
    sources:
      - path: Sources/Shoji
      - path: scripts/shoji-hook
        buildPhase: resources
      - path: scripts/shoji.zsh
        buildPhase: resources
      - path: scripts/zshenv
        buildPhase: resources
    dependencies:
      - package: SwiftTerm
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fi.yan.shoji
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Shoji
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
        # Shoji spawns shells and CLIs, so no App Sandbox (no entitlements file).
        ENABLE_APP_SANDBOX: NO

  ShojiTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/ShojiTests
    dependencies:
      - target: Shoji
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fi.yan.shoji.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Shoji:
    build:
      targets:
        Shoji: all
        ShojiTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ShojiTests
